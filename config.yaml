project:
  name: "RAG Chatbot"
  version: "1.0.0"

data:
  document_directory: "data/documents"
  processed_directory: "data/processed"

vector_store:
  directory: "storage/chroma"
  collection_name: "rag_documents"

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k: 3

llm:
  model_name: "openai/gpt-oss-120b"
  temperature: 0.2