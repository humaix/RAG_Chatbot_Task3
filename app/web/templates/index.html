<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAG Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #0f1117;

            color: #e6e6e6;

            height: 100vh;

            display: flex;

            justify-content: center;

        }

        .container {

            width: 900px;

            max-width: 95%;

            height: 95vh;

            margin-top: 20px;

            display: flex;

            flex-direction: column;

            background: #171a21;

            border: 1px solid #292d36;

            border-radius: 12px;

            overflow: hidden;

        }

        .header {

            padding: 18px 22px;

            background: #1d212a;

            border-bottom: 1px solid #292d36;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .header h1 {

            margin: 0;

            font-size: 20px;

        }

        .upload-section {

            display: flex;

            align-items: center;

            gap: 8px;

        }

        .upload-button {

            background: #2d6cdf;

            color: white;

            padding: 9px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

        }

        .upload-button:hover {

            background: #245bc0;

        }

        #file {

            display: none;

        }

        #chat {

            flex: 1;

            overflow-y: auto;

            padding: 22px;

        }

        .message {

            margin-bottom: 18px;

        }

        .user {

            color: #72a7ff;

            font-weight: bold;

            margin-bottom: 5px;

        }

        .bot {

            color: #e6e6e6;

            line-height: 1.6;

        }

        .sources {

            margin-top: 8px;

            padding: 10px;

            background: #11141a;

            border-left: 3px solid #2d6cdf;

            border-radius: 5px;

            font-size: 13px;

            color: #aeb4c0;

        }

        .sources-title {

            font-weight: bold;

            color: #d5d9e0;

            margin-bottom: 5px;

        }

        .input-area {

            display: flex;

            gap: 10px;

            padding: 15px;

            background: #1d212a;

            border-top: 1px solid #292d36;

        }

        input[type="text"] {

            flex: 1;

            padding: 13px;

            border-radius: 7px;

            border: 1px solid #343945;

            background: #11141a;

            color: white;

            outline: none;

        }

        input[type="text"]:focus {

            border-color: #2d6cdf;

        }

        button {

            padding: 13px 20px;

            border: none;

            border-radius: 7px;

            background: #2d6cdf;

            color: white;

            cursor: pointer;

        }

        button:hover {

            background: #245bc0;

        }

        .clear-button {

            background: #343945;

        }

        .clear-button:hover {

            background: #454b58;

        }

        #status {

            padding: 0 18px 10px;

            font-size: 13px;

            color: #8f96a3;

        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>RAG Document Chatbot</h1>

        <div class="upload-section">

            <label
                for="file"
                class="upload-button"
            >
                📁 Upload Document
            </label>

            <input
                type="file"
                id="file"
                accept=".pdf,.docx,.txt,.xlsx"
                onchange="uploadFile()"
            >

        </div>

    </div>


    <div id="chat"></div>

    <div id="status"></div>


    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask a question about your documents..."
        >

        <button onclick="sendQuestion()">
            Send
        </button>

        <button
            class="clear-button"
            onclick="clearChat()"
        >
            Clear
        </button>

    </div>

</div>


<script>

    async function sendQuestion() {

        const input =
            document.getElementById("question");

        const question =
            input.value.trim();

        if (!question) {
            return;
        }

        addMessage(
            "You",
            question
        );

        input.value = "";

        try {

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })

                });

            const data =
                await response.json();

            if (data.error) {

                addMessage(
                    "Bot",
                    data.error
                );

                return;
            }

            addMessage(
                "Bot",
                data.answer
            );

            if (
                data.sources &&
                data.sources.length > 0
            ) {

                addSources(
                    data.sources
                );

            }

        } catch (error) {

            addMessage(
                "Bot",
                "Unable to connect to the server."
            );

        }

    }


    function addMessage(
        sender,
        message
    ) {

        const chat =
            document.getElementById("chat");

        const container =
            document.createElement("div");

        container.className =
            "message";

        const senderClass =
            sender === "You"
                ? "user"
                : "bot";

        container.innerHTML = `
            <div class="${senderClass}">
                <strong>${sender}:</strong>
                ${escapeHtml(message)}
            </div>
        `;

        chat.appendChild(
            container
        );

        chat.scrollTop =
            chat.scrollHeight;

    }


    function addSources(sources) {

        const chat =
            document.getElementById("chat");

        const container =
            document.createElement("div");

        container.className =
            "message sources";

        const title =
            document.createElement("div");

        title.className =
            "sources-title";

        title.innerText =
            "Sources:";

        container.appendChild(title);


        sources.forEach(
            function(source) {

                const item =
                    document.createElement("div");

                item.innerText =
                    "• " + source;

                container.appendChild(item);

            }
        );


        chat.appendChild(
            container
        );

        chat.scrollTop =
            chat.scrollHeight;

    }


    async function uploadFile() {

        const fileInput =
            document.getElementById("file");

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }

        const status =
            document.getElementById("status");

        status.innerText =
            "Uploading and indexing " +
            file.name +
            "...";


        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );


        try {

            const response =
                await fetch(
                    "/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();


            if (data.error) {

                status.innerText =
                    data.error;

            } else {

                status.innerText =
                    "✓ " + data.message;

            }

        } catch (error) {

            status.innerText =
                "Upload failed.";

        }


        fileInput.value = "";

    }


    async function clearChat() {

        const response =
            await fetch(
                "/clear",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        document.getElementById(
            "chat"
        ).innerHTML = "";

        document.getElementById(
            "status"
        ).innerText =
            data.message;

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    document
        .getElementById("question")
        .addEventListener(
            "keypress",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    sendQuestion();

                }

            }
        );

</script>

</body>

</html>
